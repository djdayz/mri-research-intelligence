name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mrinsight
          POSTGRES_PASSWORD: mrinsight_ci_password
          POSTGRES_DB: mrinsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrinsight -d mrinsight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MRINSIGHT_ENVIRONMENT: test
      MRINSIGHT_DATABASE_URL: postgresql+psycopg://mrinsight:mrinsight_ci_password@localhost:5432/mrinsight_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy

      - name: Run pytest
        run: python -m pytest