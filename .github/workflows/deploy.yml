name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment.
        required: true
        type: choice
        options:
          - staging
          - production
      publish_image:
        description: Publish image to GitHub Container Registry.
        required: true
        type: boolean
        default: false
      deploy:
        description: Run environment-specific migration and release commands.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MRINSIGHT_ENVIRONMENT: test
      MRINSIGHT_DATABASE_URL: postgresql+psycopg://mrinsight:mrinsight_ci_password@localhost:5432/mrinsight_test
      MRINSIGHT_TEST_DATABASE_URL: postgresql+psycopg://mrinsight:mrinsight_ci_password@localhost:5432/mrinsight_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mrinsight_test
          POSTGRES_PASSWORD: mrinsight_ci_password
          POSTGRES_USER: mrinsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrinsight -d mrinsight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install dependency auditor
        run: python -m pip install pip-audit "setuptools>=83.0.0"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify database migration head
        run: python -m alembic current --check-heads

      - name: Check model and migration consistency
        run: python -m alembic check

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy

      - name: Run pytest
        run: python -m pytest

      - name: Run deterministic evaluation
        run: python -m mrinsight.cli eval run --output var/evaluation/golden-report.json

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Upload evaluation report
        uses: actions/upload-artifact@v6
        with:
          name: golden-evaluation-report
          path: var/evaluation/golden-report.json

  image:
    name: Build container image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --tag "${{ steps.meta.outputs.image_tag }}" .

      - name: Smoke-test installed package
        run: docker run --rm "${{ steps.meta.outputs.image_tag }}" python -c "import mrinsight; print(mrinsight.__version__)"

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.meta.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ inputs.publish_image }}
        run: docker push "${{ steps.meta.outputs.image_tag }}"

  deploy:
    name: Deploy
    needs: image
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Ensure image was published
        if: ${{ !inputs.publish_image }}
        run: |
          echo "Deployment requires publish_image=true so the target can pull the image."
          exit 1

      - name: Install SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run migrations
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_MIGRATE_COMMAND: ${{ secrets.DEPLOY_MIGRATE_COMMAND }}
        run: |
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_MIGRATE_COMMAND"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "$DEPLOY_MIGRATE_COMMAND"

      - name: Release image
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_RELEASE_COMMAND: ${{ secrets.DEPLOY_RELEASE_COMMAND }}
          IMAGE_TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          test -n "$DEPLOY_RELEASE_COMMAND"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' $DEPLOY_RELEASE_COMMAND"
