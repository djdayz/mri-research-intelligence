apiVersion: v1
kind: Namespace
metadata:
  name: mrinsight
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mrinsight-config
  namespace: mrinsight
data:
  MRINSIGHT_SERVICE_NAME: mrinsight
  MRINSIGHT_APP_NAME: MRInsight
  MRINSIGHT_ENVIRONMENT: production
  MRINSIGHT_LOG_LEVEL: INFO
  MRINSIGHT_CROSSREF_BASE_URL: https://api.crossref.org
  MRINSIGHT_CROSSREF_USER_AGENT: MRInsight/0.1
  MRINSIGHT_CROSSREF_TIMEOUT_SECONDS: "10"
  MRINSIGHT_CROSSREF_CONNECT_TIMEOUT_SECONDS: "5"
  MRINSIGHT_CROSSREF_MAX_ATTEMPTS: "3"
  MRINSIGHT_CROSSREF_BACKOFF_SECONDS: "0.5"
  MRINSIGHT_PDF_MAX_BYTES: "26214400"
  MRINSIGHT_PDF_MAX_PAGES: "500"
  MRINSIGHT_LLM_PROVIDER: unconfigured
  MRINSIGHT_LLM_MODEL: gpt-5.6
  MRINSIGHT_LLM_TIMEOUT_SECONDS: "45"
  MRINSIGHT_LLM_MAX_RETRIES: "2"
  MRINSIGHT_LLM_PROMPT_BUDGET_TOKENS: "1600"
  MRINSIGHT_DIGEST_DELIVERY_PROVIDER: file
  MRINSIGHT_DIGEST_DELIVERY_RETRY_DELAY_SECONDS: "900"
---
apiVersion: v1
kind: Secret
metadata:
  name: mrinsight-secrets
  namespace: mrinsight
type: Opaque
stringData:
  MRINSIGHT_DATABASE_URL: replace-with-managed-postgresql-url
  MRINSIGHT_CROSSREF_MAILTO: researcher@example.org
  MRINSIGHT_LLM_API_KEY: ""
  MRINSIGHT_SMTP_HOST: ""
  MRINSIGHT_SMTP_PORT: "587"
  MRINSIGHT_SMTP_USERNAME: ""
  MRINSIGHT_SMTP_PASSWORD: ""
  MRINSIGHT_SMTP_SENDER: ""
  MRINSIGHT_SMTP_USE_TLS: "true"
  MRINSIGHT_SMTP_USE_SSL: "false"
  MRINSIGHT_SMTP_TIMEOUT_SECONDS: "10"
  MRINSIGHT_SMTP_MAX_ATTEMPTS: "3"
  MRINSIGHT_SMTP_BACKOFF_SECONDS: "0.5"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mrinsight-migrate
  namespace: mrinsight
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/OWNER/mri-research-intelligence:TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: mrinsight-config
            - secretRef:
                name: mrinsight-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrinsight-api
  namespace: mrinsight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mrinsight-api
  template:
    metadata:
      labels:
        app: mrinsight-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/mri-research-intelligence:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mrinsight-config
            - secretRef:
                name: mrinsight-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mrinsight-api
  namespace: mrinsight
spec:
  type: ClusterIP
  selector:
    app: mrinsight-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mrinsight-digest-run-due
  namespace: mrinsight
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest-run-due
              image: ghcr.io/OWNER/mri-research-intelligence:TAG
              command:
                ["python", "-m", "mrinsight.cli", "digest", "run-due", "--rows", "20"]
              envFrom:
                - configMapRef:
                    name: mrinsight-config
                - secretRef:
                    name: mrinsight-secrets
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mrinsight-digest-retry-deliveries
  namespace: mrinsight
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest-retry-deliveries
              image: ghcr.io/OWNER/mri-research-intelligence:TAG
              command:
                [
                  "python",
                  "-m",
                  "mrinsight.cli",
                  "digest",
                  "retry-deliveries",
                  "--limit",
                  "20",
                ]
              envFrom:
                - configMapRef:
                    name: mrinsight-config
                - secretRef:
                    name: mrinsight-secrets
